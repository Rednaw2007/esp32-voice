<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Voice Automation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0f12;
      background-image: radial-gradient(circle at 50% 20%, #1e293b 0%, #0d0f12 70%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(37, 99, 235, 0.12);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-speak {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-speak:hover {
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
    }

    .btn-speak:active {
      transform: scale(0.98);
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      text-align: center;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-control {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: white;
      transition: filter 0.2s, transform 0.1s;
    }

    .btn-control:active {
      transform: scale(0.97);
    }

    .btn-on {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .btn-on:hover { filter: brightness(1.1); }

    .btn-off {
      background: linear-gradient(135deg, #6b7280, #4b5563);
    }
    .btn-off:hover { filter: brightness(1.1); }

    /* Terminal Console Window Styling */
    .terminal-wrapper {
      background-color: #090d13;
      border: 1px solid #1e293b;
      border-left: 3px solid #3b82f6;
      border-radius: 10px;
      overflow: hidden;
    }

    .terminal-header {
      background-color: #0f172a;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #1e293b;
    }

    .terminal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-red { background-color: #ef4444; }
    .dot-yellow { background-color: #f59e0b; }
    .dot-green { background-color: #10b981; }

    .terminal {
      padding: 12px;
      height: 150px;
      overflow-y: auto;
      font-family: "JetBrains Mono", "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #22c55e;
      scroll-behavior: smooth;
    }

    .terminal p {
      margin-bottom: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>ESP32 Voice Automation</h1>
      <span class="status-dot" title="MQTT Connected"></span>
    </div>

    <div class="form-group">
      <label for="apiKey">Groq API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your Groq API Key..." />
    </div>

    <button class="btn-speak" id="speakBtn">
      🎤 Tap to Speak
    </button>

    <div class="section-title">Manual Override Controls</div>
    <div class="controls-grid">
      <button class="btn-control btn-on" id="onBtn">⚡ TURN ON</button>
      <button class="btn-control btn-off" id="offBtn">⭕ TURN OFF</button>
    </div>

    <div class="section-title">Command Executed</div>
    <div class="terminal-wrapper">
      <div class="terminal-header">
        <span class="terminal-dot dot-red"></span>
        <span class="terminal-dot dot-yellow"></span>
        <span class="terminal-dot dot-green"></span>
      </div>
      <div class="terminal" id="terminalLog">
        <p>&gt; System ready.</p>
      </div>
    </div>
  </div>

</body>
</html>
