<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Relay Sequence Controller</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      width: 400px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    #recordBtn {
      background-color: #3498db;
      color: #fff;
    }
    #recordBtn.recording {
      background-color: #e74c3c;
    }
    #recordBtn:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
    }
    .override-btns button {
        background-color: #2ecc71;
        color: white;
    }
    .override-btns button#offBtn {
        background-color: #95a5a6;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
    }
    #transcript {
        margin-top: 10px;
        font-style: italic;
        color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ESP32 Relay Controller</h2>
    <p>Voice Control (Chrome/Edge only):</p>
    <button id="recordBtn">Hold to Speak</button>
    <div id="transcript"></div>

    <hr>
    <p>Manual Override:</p>
    <div class="override-btns">
        <button id="onBtn">Turn ON</button>
        <button id="offBtn">Turn OFF</button>
    </div>
    
    <div id="status">Status: Disconnected</div>
  </div>

  <script>
    // --- Configuration ---
    const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt'; // HiveMQ public websocket port
    const MQTT_TOPIC = 'esp32/relay/control';
    const CLIENT_ID = 'WebVoiceClient-' + Math.random().toString(16).substring(2, 8);

    // --- State & DOM Elements ---
    let mqttClient = null;
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];

    const recordBtn = document.getElementById('recordBtn');
    const onBtn = document.getElementById('onBtn');
    const offBtn = document.getElementById('offBtn');
    const statusDiv = document.getElementById('status');
    const transcriptDiv = document.getElementById('transcript');

    // --- Helpers ---
    function updateStatus(msg) {
        statusDiv.textContent = `Status: ${msg}`;
    }

    function publishJson(payload) {
        if (mqttClient && mqttClient.connected) {
            const jsonString = JSON.stringify(payload);
            mqttClient.publish(MQTT_TOPIC, jsonString);
            updateStatus(`Sent command: ${Object.keys(payload.sequence[0])[0]}...`);
            console.log("Published:", jsonString);
        } else {
            updateStatus("Error: MQTT not connected.");
        }
    }

    // --- 1. MQTT Connection Setup ---
    function connectMqtt() {
        updateStatus("Connecting to MQTT...");
        mqttClient = mqtt.connect(MQTT_BROKER, { clientId: CLIENT_ID });

        mqttClient.on('connect', () => {
            updateStatus("Connected to MQTT broker.");
            recordBtn.disabled = false; // Enable voice control once connected
        });

        mqttClient.on('error', (err) => {
            updateStatus(`MQTT Error: ${err.message}`);
            console.error(err);
        });

        mqttClient.on('close', () => {
            updateStatus("MQTT Connection closed.");
            recordBtn.disabled = true;
        });
    }

    // --- 2. User Media & Voice Setup ---
    async function setupVoice() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            updateStatus("Voice control not supported in this browser.");
            recordBtn.disabled = true;
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                audioChunks = []; // Clear for next recording
                updateStatus("Processing voice...");
                await processAudio(audioBlob);
            };

            // Setup Hold-to-Speak behavior
            recordBtn.addEventListener('mousedown', startRecording);
            recordBtn.addEventListener('mouseup', stopRecording);
            recordBtn.addEventListener('mouseleave', stopRecording); // Stop if mouse leaves button
             // For touch devices
            recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
            recordBtn.addEventListener('touchend', stopRecording);

        } catch (err) {
            updateStatus(`Microphone access denied: ${err.message}`);
            console.error(err);
            recordBtn.disabled = true;
        }
    }

    function startRecording() {
        if (isRecording || !mediaRecorder) return;
        isRecording = true;
        recordBtn.classList.add('recording');
        recordBtn.textContent = "Listening...";
        transcriptDiv.textContent = "";
        audioChunks = [];
        mediaRecorder.start();
    }

    function stopRecording() {
        if (!isRecording || !mediaRecorder) return;
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = "Hold to Speak";
        mediaRecorder.stop();
    }

    // --- 3. Audio to Text (Using Browser's Speech Recognition) ---
    // Note: For a real application, you'd send the Blob to a backend
    // which calls a Speech API (Google, OpenAI Whisper, etc.) for better accuracy.
    // Here we use the built-in browser API as a demonstration.
    async function processAudio(audioBlob) {
        if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
             transcriptDiv.textContent = "(Simulated) Processing complete. Command would be inferred from audio blob.";
             inferCommand("turn on"); // Placeholder simulation
             return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        // The browser's SpeechRecognition API works on live audio, not directly on blobs.
        // As a workaround for this front-end only example, we use the simpler API.
        // In a real app, this step is handled by the backend.
        
        // This browser API needs to re-request mic access if not active.
        // Let's assume the user is using a compatible browser like Chrome.

        recognition.onresult = (event) => {
            const speechToText = event.results[0][0].transcript.toLowerCase();
            console.log("Speech recognized:", speechToText);
            transcriptDiv.textContent = `Heard: "${speechToText}"`;
            inferCommand(speechToText);
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            updateStatus(`Speech recognition error: ${event.error}`);
        };

        recognition.onend = () => {
            console.log("Speech recognition ended.");
        };

        // We can't feed the blob directly, so we use the simpler recognition
        // just to simulate getting a string.
        recognition.start();
        updateStatus("Recognizing speech...");
    }

    // --- 4. Command Inference ---
    function inferCommand(text) {
        if (text.includes("on")) {
            publishJson({ sequence: [{ action: "ON", duration_seconds: 0 }] });
        } else if (text.includes("off")) {
            publishJson({ sequence: [{ action: "OFF", duration_seconds: 0 }] });
        } else {
            updateStatus("Could not understand command.");
        }
    }

    // --- 5. Manual Override ---
    onBtn.addEventListener('click', () => {
        publishJson({ sequence: [{ action: "ON", duration_seconds: 0 }] });
    });

    offBtn.addEventListener('click', () => {
        publishJson({ sequence: [{ action: "OFF", duration_seconds: 0 }] });
    });

    // --- Initialization ---
    window.onload = () => {
        // Voice is only enabled after successful MQTT connection
        recordBtn.disabled = true; 
        connectMqtt();
        setupVoice();
    };

  </script>
</body>
</html>
