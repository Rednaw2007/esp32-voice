<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ESP32 Voice Automation</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .field { margin-bottom: 1rem; text-align: left; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    
    button { width: 100%; padding: 12px; border-radius: 25px; border: none; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s ease; }
    .mic-btn { background: #007bff; }
    .mic-btn:hover { background: #0056b3; }
    .mic-btn.listening { background: #dc3545; animation: pulse 1.2s infinite; }
    
    /* Manual override button styles */
    .override-section { margin-top: 1.5rem; border-top: 1px solid #333; padding-top: 1rem; }
    .override-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-on { background: #28a745; border-radius: 8px; }
    .btn-on:hover { background: #218838; }
    .btn-off { background: #dc3545; border-radius: 8px; }
    .btn-off:hover { background: #c82333; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .status { margin-top: 1rem; font-size: 0.85rem; color: #888; text-align: center; }
    .log { background: #000; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; height: 140px; overflow-y: auto; margin-top: 1rem; color: #00ff66; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ESP32 Voice Automation</h2>
    
    <div class="field">
      <label for="apiKey">Groq API Key</label>
      <input type="password" id="apiKey"  placeholder="gsk_..." />
    </div>

    <button id="micBtn" class="mic-btn">🎤 Tap to Speak</button>

    <!-- Manual System Override Buttons -->
    <div class="override-section">
      <label>Manual Override Controls</label>
      <div class="override-grid">
        <button id="btnOn" class="btn-on">⚡ TURN ON</button>
        <button id="btnOff" class="btn-off">🛑 TURN OFF</button>
      </div>
    </div>

    <div id="status" class="status">Connecting to MQTT...</div>
    <div id="log" class="log">> System ready.<br></div>
  </div>

  <script>
    const MQTT_TOPIC = "esp32/relay/control";
    
    const micBtn = document.getElementById("micBtn");
    const btnOn = document.getElementById("btnOn");
    const btnOff = document.getElementById("btnOff");
    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");
    const apiKeyInput = document.getElementById("apiKey");

    function appendLog(msg) {
      logDiv.innerHTML += `> ${msg}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    mqttClient.on('connect', () => {
      statusDiv.innerText = "Status: Connected to HiveMQ";
      appendLog("MQTT connected.");
    });

    mqttClient.on('error', (err) => {
      statusDiv.innerText = "MQTT Connection Error";
      appendLog("MQTT Error: " + err);
    });

    // Function to send direct manual override command via MQTT
    function sendOverrideCommand(action) {
      if (!mqttClient.connected) {
        alert("MQTT is not connected!");
        return;
      }
      
      const payload = {
        sequence: [
          { action: action, duration_seconds: 0 }
        ]
      };

      mqttClient.publish(MQTT_TOPIC, JSON.stringify(payload));
      appendLog(`Manual Override: Sent ${action} to ${MQTT_TOPIC}`);
      statusDiv.innerText = `Override Executed: ${action}`;
    }

    btnOn.addEventListener("click", () => sendOverrideCommand("ON"));
    btnOff.addEventListener("click", () => sendOverrideCommand("OFF"));

    // Speech Recognition setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Speech Recognition not supported in this browser.");
    }

    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-US';

    micBtn.addEventListener("click", () => {
      if (!apiKeyInput.value.trim()) {
        alert("Please enter your Groq API Key first!");
        return;
      }
      recognition.start();
      micBtn.classList.add("listening");
      micBtn.innerText = "Listening...";
    });

    recognition.onresult = async (event) => {
      micBtn.classList.remove("listening");
      micBtn.innerText = "🎤 Tap to Speak";
      const transcript = event.results[0][0].transcript;
      appendLog(`Heard: "${transcript}"`);
      
      await queryGroqAI(transcript);
    };

    recognition.onerror = (event) => {
      micBtn.classList.remove("listening");
      micBtn.innerText = "🎤 Tap to Speak";
      appendLog("Speech Error: " + event.error);
    };

    async function queryGroqAI(transcript) {
      statusDiv.innerText = "Parsing command sequence...";
      
      const systemPrompt = `You are a smart home relay controller. Parse spoken voice commands into a chronological sequence of relay actions. 
Output ONLY raw JSON matching this structure:
{
  "sequence": [
    {"action": "ON" | "OFF", "duration_seconds": number}
  ]
}
Notes:
- Break complex multi-step instructions into sequential steps.
- If a step is permanent or end-of-sequence, set duration_seconds to 0.`;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKeyInput.value.trim()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            response_format: { type: "json_object" },
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: transcript }
            ]
          })
        });

        const data = await response.json();
        const parsedCommand = JSON.parse(data.choices[0].message.content);
        
        appendLog(`Output: ${JSON.stringify(parsedCommand)}`);
        
        mqttClient.publish(MQTT_TOPIC, JSON.stringify(parsedCommand));
        appendLog(`Sent to MQTT: ${MQTT_TOPIC}`);
        statusDiv.innerText = "Command Executed!";
      } catch (err) {
        appendLog("Groq Error: " + err.message);
        statusDiv.innerText = "AI Processing Failed";
      }
    }
  </script>
</body>
</html>
