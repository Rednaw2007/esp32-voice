<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Voice Automation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a0a0;
      margin-bottom: 8px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #3b82f6;
    }

    .btn-speak {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      transition: background 0.2s;
    }

    .btn-speak:hover {
      background-color: #1d4ed8;
    }

    .section-title {
      font-size: 0.85rem;
      color: #a0a0a0;
      margin-bottom: 10px;
      text-align: center;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-control {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    .btn-on {
      background-color: #10b981;
    }
    .btn-on:hover { background-color: #059669; }

    .btn-off {
      background-color: #6b7280;
    }
    .btn-off:hover { background-color: #4b5563; }

    .terminal {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      height: 150px;
      overflow-y: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #22c55e;
    }

    .terminal p {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ESP32 Voice Automation</h1>

    <div class="form-group">
      <label for="apiKey">Groq API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your Groq API Key..." />
    </div>

    <button class="btn-speak" id="speakBtn">
      🎤 Tap to Speak
    </button>

    <div class="section-title">Manual Override Controls</div>
    <div class="controls-grid">
      <button class="btn-control btn-on" id="onBtn">⚡ TURN ON</button>
      <button class="btn-control btn-off" id="offBtn">⭕ TURN OFF</button>
    </div>

    <div class="section-title">Command Executed</div>
    <div class="terminal" id="terminalLog">
      <p>&gt; System ready.</p>
    </div>
  </div>

</body>
</html>
